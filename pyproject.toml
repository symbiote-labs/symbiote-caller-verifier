[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["symbiote_caller_verifier"]

[tool.hatch.build.targets.sdist]
include = ["symbiote_caller_verifier", "tests", "examples", "README.md", "LICENSE", "CHANGELOG.md"]

[project]
name = "symbiote-caller-verifier"
version = "0.2.0"
description = "Verify Symbiote caller assertions before an MCP tool runs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Symbiote Labs" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
# Exact pins are the tested set; the helper carries one crypto
# dependency and one canonicaliser and nothing else at runtime.
dependencies = [
    "cryptography==50.0.0",
    "rfc8785==0.1.4",
]

[project.urls]
Repository = "https://github.com/symbiote-labs/symbiote-caller-verifier"
Releases = "https://github.com/symbiote-labs/symbiote-caller-verifier/releases"

[project.optional-dependencies]
fastmcp = ["fastmcp==3.4.7"]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-timeout==2.4.0",
    "ruff==0.15.7",
    "mypy==1.19.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
packages = ["symbiote_caller_verifier"]
